name: Build frp darwin/armv7 (iOS 32-bit)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go 1.14 (darwin/arm support)
      uses: actions/setup-go@v5
      with:
        go-version: '1.14.15'  # Last stable with darwin/arm[web:136][web:141]

    - name: Build frp darwin armv7
      env:
        CGO_ENABLED: 0
        GOOS: darwin
        GOARCH: arm
        GOARM: 7  # armv7 Cortex-A8 (iPad2)
      run: |
        go build -trimpath -ldflags="-s -w" -tags frps -o frps_darwin_armv7 ./cmd/frps
        go build -trimpath -ldflags="-s -w" -tags frpc -o frpc_darwin_armv7 ./cmd/frpc

    - name: Strip binaries
      run: |
        strip -S frps_darwin_armv7
        strip -S frpc_darwin_armv7

    - name: Verify
      run: |
        file frps_darwin_armv7  # Mach-O arm v7 executable
        lipo -info frps_darwin_armv7

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: frp-darwin-armv7-${{ github.sha }}
        path: |
          frps_darwin_armv7
          frpc_darwin_armv7
