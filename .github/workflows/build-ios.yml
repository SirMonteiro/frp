name: frp Darwin/armv7 Mach-O (iOS)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel  # Intel x86 → Downloads Go 1.14 x86[attached_file:2]
    steps:
    - uses: actions/checkout@v4

    - name: Install Go 1.14 manually
      run: |
        curl -L https://golang.org/dl/go1.14.15.darwin-amd64.tar.gz | tar xz -C /tmp
        echo "/tmp/go/bin" >> $GITHUB_PATH
        /tmp/go/bin/go version  # 1.14.15 darwin/amd64

    - name: Build frp
      env:
        CGO_ENABLED: 0
        GOOS: darwin
        GOARCH: arm
        GOARM: 7
      run: |
        go build -trimpath -ldflags="-s -w" -tags frps -o frps_macho_armv7 ./cmd/frps
        go build -trimpath -ldflags="-s -w" -tags frpc -o frpc_macho_armv7 ./cmd/frpc

    - name: Strip & verify
      run: |
        strip -S frps_macho_armv7
        file frps_macho_armv7  # Mach-O executable arm_v7

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: frp-macho-armv7
        path: |
          frps_macho_armv7
          frpc_macho_armv7
