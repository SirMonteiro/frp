name: Cross-compile frp for iOS armv7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-13  # Has Xcode/iOS SDKs
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'  # Latest stable

    - name: Install Xcode command line tools
      run: |
        sudo xcode-select --install
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build frp (Darwin armv7 hack)
      env:
        CGO_ENABLED: 0
        GOOS: darwin
        GOARCH: arm  # armv7 equiv; Go uses armv6+ subset
        GOARM: 7     # Explicit armv7
        CC: clang    # iOS-like
        CXX: clang++
        CGO_LDFLAGS: "-arch armv7 -mios-version-min=9.0"  # iOS min version hack
      run: |
        make -f Makefile.cross-compiles  # Or custom: go build -trimpath -ldflags="-s -w" -o frps_darwin_armv7 ./cmd/frps
        go build -trimpath -ldflags="-s -w" -tags frps -o frps_ios_armv7 ./cmd/frps
        go build -trimpath -ldflags="-s -w" -tags frpc -o frpc_ios_armv7 ./cmd/frpc

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: frp-ios-armv7
        path: |
          frps_ios_armv7
          frpc_ios_armv7
