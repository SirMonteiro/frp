name: frp Darwin/armv7 (after go.mod downgrade)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel  # Intel for Go 1.14 download
    steps:
    - uses: actions/checkout@v4

    - name: Install Go 1.14
      run: |
        curl -L https://golang.org/dl/go1.14.15.darwin-amd64.tar.gz | tar xz -C /tmp
        echo "/tmp/go/bin" >> $GITHUB_PATH
        go version  # go1.14.15 darwin/amd64

    - name: Tidy modules (post-downgrade)
      run: go mod tidy  # Resolves deps for 1.14

    - name: Build
      env:
        CGO_ENABLED: 0
        GOOS: darwin
        GOARCH: arm
        GOARM: 7
      run: |
        go build -trimpath -ldflags="-s -w" -tags frps -o frps_armv7 ./cmd/frps
        go build -trimpath -ldflags="-s -w" -tags frpc -o frpc_armv7 ./cmd/frpc

    - name: Strip & verify
      run: |
        strip -S frps_armv7
        file frps_armv7  # Mach-O arm_v7

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: frp-darwin-armv7
        path: |
          frps_armv7
          frpc_armv7
